<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Docs — Ansai Trust Engine</title>
<link rel="stylesheet" href="styles.css">
<style>
  .docs-topbar{display:flex;align-items:center;gap:1rem;padding:1rem 2rem;border-bottom:1px solid #e5e7eb;background:#fff;position:sticky;top:0;z-index:10}
  .docs-topbar .brand{font-weight:700}
  .docs-topbar a.home{margin-left:auto;color:#2563eb;text-decoration:none}
  .docs-layout{display:flex;max-width:1200px;margin:0 auto;min-height:80vh}
  .docs-nav{width:260px;flex-shrink:0;padding:1.5rem 1rem;border-right:1px solid #e5e7eb}
  .docs-nav h4{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:#6b7280;margin:1rem 0 .25rem}
  .docs-nav h4:first-child{margin-top:0}
  .docs-nav a.doclink{display:block;padding:.35rem .5rem;border-radius:6px;color:#111827;text-decoration:none;font-size:.92rem}
  .docs-nav a.doclink:hover{background:#f3f4f6}
  .docs-nav a.doclink.active{background:#17222C;color:#fff}
  .docs-main{flex:1;padding:2rem;max-width:820px}
  .docs-main h1{font-size:1.8rem;margin-bottom:1rem}
  .docs-main h2{font-size:1.35rem;margin:1.75rem 0 .75rem}
  .docs-main h3{font-size:1.1rem;margin:1.25rem 0 .5rem}
  .docs-main p,.docs-main li{line-height:1.65;color:#1f2937}
  .docs-main code{background:#f3f4f6;padding:.15em .4em;border-radius:4px;font-size:.88em}
  .docs-main pre{background:#17222C;color:#e5e7eb;padding:1rem;border-radius:8px;overflow-x:auto}
  .docs-main pre code{background:none;color:inherit;padding:0}
  .docs-main table{border-collapse:collapse;width:100%;margin:1rem 0}
  .docs-main th,.docs-main td{border:1px solid #e5e7eb;padding:.5rem .75rem;text-align:left;font-size:.92rem}
  .docs-main th{background:#f9fafb}
  .living-note{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;padding:.75rem 1rem;border-radius:8px;font-size:.9rem;margin-bottom:1.5rem}
  @media(max-width:800px){.docs-layout{flex-direction:column}.docs-nav{width:auto;border-right:none;border-bottom:1px solid #e5e7eb}}
</style>
</head>
<body>
<header class="docs-topbar">
  <span class="brand">Ansai Technologies</span>
  <span>· Trust Engine Docs</span>
  <a class="home" href="index.html">← Back to site</a>
</header>
<div class="docs-layout">
  <aside class="docs-nav" id="docs-nav"><p>Loading documents…</p></aside>
  <main class="docs-main" id="docs-content">
    <div class="living-note">Living docs — this page renders directly from the <code>docs/</code> folder of the
    <a href="https://github.com/Ansai-technologies/attestation/tree/main/docs">attestation repo</a>.
    Merge to <code>main</code> there and it appears here automatically. No separate publishing step.</div>
    <div id="doc-body"><p>Select a document on the left.</p></div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script>
const OWNER = 'Ansai-technologies', REPO = 'attestation', BRANCH = 'main';
const FALLBACK = [
  { path: 'docs/README.md', title: 'Overview' },
  { path: 'docs/concepts.md', title: 'Concepts' },
  { path: 'docs/api-reference.md', title: 'API Reference' },
  { path: 'docs/guides/verifying-mpesa-payment.md', title: 'Verifying an M-Pesa payment' },
  { path: 'docs/guides/verifying-counterparty.md', title: 'Verifying a counterparty' },
  { path: 'docs/guides/etims-ready-records.md', title: 'eTIMS-ready records' },
];
function pretty(name){
  return name.replace(/\.md$/,'').replace(/[-_]/g,' ')
    .replace(/\b\w/g, c => c.toUpperCase()).replace('Api','API').replace('Mpesa','M-Pesa').replace('Etims','eTIMS');
}
async function listDocs(){
  try{
    const out = [];
    async function walk(url){
      const r = await fetch(url);
      if(!r.ok) throw new Error('listing failed');
      const items = await r.json();
      for(const it of items){
        if(it.type === 'dir') await walk(it.url);
        else if(it.name.endsWith('.md')) out.push({ path: it.path, title: pretty(it.name) });
      }
    }
    await walk(`https://api.github.com/repos/${OWNER}/${REPO}/contents/docs?ref=${BRANCH}`);
    if(out.length) return out;
    throw new Error('empty');
  }catch(e){ return FALLBACK; }
}
async function loadDoc(path){
  const body = document.getElementById('doc-body');
  body.innerHTML = '<p>Loading…</p>';
  try{
    const r = await fetch(`https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${path}`);
    if(!r.ok) throw new Error('fetch failed');
    const md = await r.text();
    body.innerHTML = DOMPurify.sanitize(marked.parse(md));
    document.querySelectorAll('#docs-nav a.doclink').forEach(a =>
      a.classList.toggle('active', a.dataset.path === path));
    window.scrollTo(0,0);
  }catch(e){
    body.innerHTML = '<p>Could not load this document. Check your connection — the docs live in the ' +
      '<a href="https://github.com/Ansai-technologies/attestation/tree/main/docs">attestation repo</a>.</p>';
  }
}
(async function init(){
  const nav = document.getElementById('docs-nav');
  const files = await listDocs();
  const groups = {};
  files.forEach(f => {
    const parts = f.path.split('/');
    const g = parts.length > 2 ? pretty(parts[1]) : 'General';
    (groups[g] = groups[g] || []).push(f);
  });
  nav.innerHTML = '';
  Object.keys(groups).sort().forEach(g => {
    const h = document.createElement('h4'); h.textContent = g; nav.appendChild(h);
    groups[g].forEach(f => {
      const a = document.createElement('a');
      a.href = '#'; a.className = 'doclink'; a.dataset.path = f.path; a.textContent = f.title;
      a.onclick = e => { e.preventDefault(); loadDoc(f.path); };
      nav.appendChild(a);
    });
  });
  const first = (groups['General'] || Object.values(groups)[0] || [])[0];
  if(first) loadDoc(first.path);
})();
</script>
</body>
</html>
